<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support Ticket Widget</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="ticket-widget">
        <button id="support-fab" aria-label="Open support ticket">
            <span aria-hidden="true">?</span>
        </button>

        <div id="ticket-modal" class="ticket-modal" aria-hidden="true">
            <div class="ticket-modal__content" role="dialog" aria-modal="true">
                <div class="ticket-modal__header">
                    <h2>Behn Meyer - Ticketing Support Widget</h2>
                    <button class="ticket-modal__close" aria-label="Close">&times;</button>
                </div>

                <div class="ticket-modal__tabs" role="tablist" aria-label="Ticket sections">
                    <button
                        class="tab-btn active"
                        type="button"
                        data-tab="create"
                        role="tab"
                        aria-selected="true"
                        aria-controls="create-panel"
                        id="tab-create"
                    >
                        Create Ticket
                    </button>
                    <button
                        class="tab-btn"
                        type="button"
                        data-tab="history"
                        role="tab"
                        aria-selected="false"
                        aria-controls="history-panel"
                        id="tab-history"
                    >
                        My Tickets
                    </button>
                </div>

                <div class="ticket-modal__body">
                    <div class="tab-panel active" id="create-panel" role="tabpanel" aria-labelledby="tab-create">
                        <form id="ticket-form" novalidate>
                            <label class="combined-field">
                                <span class="label-text">Username - Email</span>
                                <input
                                    type="text"
                                    id="contact-field"
                                    name="contact"
                                    placeholder="[Internal User Name] - [Internal User Email]"
                                    readonly
                                    required
                                />
                            </label>

                            <label>
                                Type
                                <select name="type" required>
                                    <option value="">Select Report Type...</option>
                                    <option value="bug">Bug Report</option>
                                    <option value="support">Support</option>
                                    <option value="feature">Feature Request</option>
                                </select>
                            </label>

                            <label>
                                Subject
                                <input type="text" name="subject" required />
                            </label>

                            <label>
                                Message
                                <textarea name="message" rows="4" required></textarea>
                            </label>

                            <label class="optional-field">
                                <span class="label-text">Additional File <span class="optional-label">(optional)</span></span>
                                <input type="file" id="file-input" name="files" multiple />
                                <small id="file-warning" class="file-warning"></small>
                            </label>

                            <button type="submit">Submit Ticket</button>
                        </form>
                    </div>

                    <div class="tab-panel" id="history-panel" role="tabpanel" aria-labelledby="tab-history" hidden>
                        <div class="ticket-history">
                            <table>
                                <thead>
                                    <tr>
                                        <th>User</th>
                                        <th>Subject</th>
                                        <th>Apps</th>
                                        <th>Type</th>
                                        <th>Status</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody id="ticket-history-body">
                                    <tr class="empty-row">
                                        <td colspan="6">No tickets submitted yet.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
